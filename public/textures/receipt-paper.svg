<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Soft fibrous paper: long horizontal fibres plus faint speckle, warm tint -->
  <filter id="fibres" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.55" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.47  0 0 0 0 0.40  0 0 0 0 0.27  0 0 0 0.16 0"/>
  </filter>
  <filter id="speck" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="1" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0.10 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#fibres)"/>
  <rect width="100%" height="100%" filter="url(#speck)"/>
</svg>
